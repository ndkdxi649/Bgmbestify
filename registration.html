<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestify Mobile Kolavi - Sign Up / Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Poppins', 'Noto Sans Kannada', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            touch-action: manipulation;
        }

        /* Success Card Pop Animation */
        @keyframes modalPop {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-4">

    <!-- Card Container -->
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-md overflow-hidden border border-gray-200">
        
        <!-- Top Banner Image (Slightly Taller Height) -->
        <div class="relative w-full bg-gray-900 border-b border-gray-200">
            <img src="https://i.ibb.co/NghDC1wy/file-0000000028608211bf13fdaf9c03334e.png" 
                 alt="Bestify Mobile Kolavi Banner" 
                 class="w-full h-36 sm:h-40 object-cover">
        </div>

        <!-- Form Body -->
        <div class="p-5 space-y-4">

            <!-- Title & Simple Trust Tagline -->
            <div class="text-center border-b border-gray-100 pb-3">
                <h1 class="text-xl font-bold text-gray-900 tracking-wide">
                    <span class="text-red-600">Bestify</span> Mobile Kolavi
                </h1>
                <p class="text-xs font-semibold text-gray-600 mt-1">
                    100% ಸ್ಥಳೀಯ ನಂಬಿಕೆ - ನಿಮ್ಮ ಕೊಳವಿ ಅಂಗಡಿ
                </p>
            </div>

            <!-- GOOGLE SIGN IN BUTTON -->
            <button type="button" onclick="handleGoogleSignIn()" class="w-full bg-white hover:bg-gray-50 text-gray-800 font-semibold py-2.5 px-4 rounded-xl border border-gray-300 shadow-sm flex items-center justify-center space-x-3 transition active:scale-95 text-xs">
                <!-- Google SVG Logo -->
                <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Google ಮೂಲಕ ಲಾಗಿನ್ ಆಗಿ</span>
            </button>

            <!-- Simple Divider -->
            <div class="relative flex py-0.5 items-center">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink mx-3 text-gray-400 text-xs font-medium">ಅಥವಾ</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <!-- FORM: PHONE NUMBER + WHATSAPP OTP -->
            <form id="loginForm" onsubmit="handleWhatsappOtp(event)" class="space-y-3">
                
                <!-- Phone Input Box (+91) -->
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">
                        ಮೊಬೈಲ್ ನಂಬರ್ / Mobile Number
                    </label>
                    <div class="relative flex items-center">
                        <span class="absolute left-3 text-xs font-bold text-gray-600 border-r border-gray-300 pr-2.5">+91</span>
                        <input type="tel" id="userPhone" required pattern="[0-9]{10}" maxlength="10" 
                            placeholder="ಮೊಬೈಲ್ ನಂಬರ್ ಹಾಕಿ" 
                            class="w-full pl-14 pr-3 py-2.5 text-sm font-semibold rounded-xl border border-gray-300 bg-white text-gray-900 focus:ring-1 focus:ring-red-600 focus:border-red-600 outline-none transition">
                    </div>
                </div>

                <!-- OTP Input Field (Step 2) -->
                <div id="otpBox" class="hidden space-y-1.5">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-semibold text-emerald-700">
                            WhatsApp ಗೇ ಬಂದ OTP ಹಾಕಿ
                        </label>
                        <button type="button" onclick="resendOtp()" class="text-[11px] text-emerald-600 font-bold hover:underline">
                            ಮತ್ತೆ OTP ಕಳುಹಿಸಿ
                        </button>
                    </div>
                    <input type="text" id="otpInput" maxlength="6" placeholder="• • • • • •" 
                        class="w-full px-3 py-2 text-center tracking-widest font-mono text-lg font-bold rounded-xl border border-emerald-500 bg-emerald-50 text-emerald-800 focus:ring-1 focus:ring-emerald-600 outline-none">
                </div>

                <!-- WhatsApp OTP Button -->
                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-3 px-4 rounded-xl shadow-sm transition active:scale-95 flex items-center justify-center space-x-2">
                    <i class="fab fa-whatsapp text-base"></i>
                    <span id="btnText">Send OTP (OTP WhatsApp)</span>
                </button>

            </form>

        </div>

        <!-- Footer -->
        <div class="bg-gray-50 p-2.5 text-center border-t border-gray-200 text-[11px] text-gray-500">
            <span>ಬೆಸ್ಟಿಫೈ ಮೊಬೈಲ್ - ಕೊಳವಿ</span>
        </div>

    </div>

    <!-- ATTRACTIVE SUCCESS LOGIN POPUP MODAL -->
    <div id="successModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-xs w-full text-center shadow-2xl border border-emerald-100 animate-pop">
            <!-- Animated Green Check Icon -->
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3 text-3xl shadow-inner">
                <i class="fas fa-check-circle"></i>
            </div>
            
            <h3 class="text-xl font-extrabold text-gray-900">ಲಾಗಿನ್ ಯಶಸ್ವಿಯಾಗಿದೆ!</h3>
            <p class="text-xs text-emerald-600 font-bold mt-1">Login Successful</p>
            
            <div class="my-4 p-3 bg-emerald-50/60 rounded-2xl text-center border border-emerald-100">
                <p class="text-xs text-gray-600 font-medium">ಸ್ವಾಗತ / Welcome to</p>
                <p class="text-sm font-bold text-gray-900 mt-0.5">ಬೆಸ್ಟಿಫೈ ಮೊಬೈಲ್ ಕೊಳವಿ</p>
                <p class="text-[11px] text-gray-500 mt-1" id="loggedInPhone"></p>
            </div>

            <button onclick="closeSuccessModal()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 text-xs rounded-xl shadow-md transition active:scale-95">
                ಮುಂದುವರಿಯಿರಿ / Continue
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let isOtpSent = false;

        function handleWhatsappOtp(event) {
            event.preventDefault();
            const phone = document.getElementById('userPhone').value.trim();
            const otpBox = document.getElementById('otpBox');
            const btnText = document.getElementById('btnText');

            if (!isOtpSent) {
                if(phone.length === 10) {
                    isOtpSent = true;
                    otpBox.classList.remove('hidden');
                    btnText.innerText = 'Verify WhatsApp OTP (WhatsApp Verify OTP)';
                    alert('WhatsApp ಗೆ OTP ಕಳುಹಿಸಲಾಗಿದೆ: 1234 (Demo OTP)');
                } else {
                    alert('ದಯವಿಟ್ಟು 10 ಅಂಕಿಯ ಸರಿಯಾದ ಮೊಬೈಲ್ ನಂಬರ್ ಹಾಕಿ.');
                }
            } else {
                const otp = document.getElementById('otpInput').value.trim();
                if(otp === '1234' || otp.length === 4 || otp.length === 6) {
                    // Show Attractive Success Login Modal
                    document.getElementById('loggedInPhone').innerText = '+91 ' + phone;
                    document.getElementById('successModal').classList.remove('hidden');
                } else {
                    alert('ತಪ್ಪಾದ OTP! ದಯವಿಟ್ಟು WhatsApp ಮೆಸೇಜ್‌ನಲ್ಲಿ ಬಂದ OTP ಹಾಕಿ.');
                }
            }
        }

        function closeSuccessModal() {
            document.getElementById('successModal').classList.add('hidden');
            // Optional: Redirect to home page or quick order page
        }

        function handleGoogleSignIn() {
            document.getElementById('loggedInPhone').innerText = 'Google Account Connected';
            document.getElementById('successModal').classList.remove('hidden');
        }

        function resendOtp() {
            alert('WhatsApp ಗೆ ಹೊಸ OTP ಕಳುಹಿಸಲಾಗಿದೆ!');
        }
    </script>
</body>
</html>
